services:
  # PostgreSQL Database for HA Control Plane
  postgres:
    image: postgres:18-alpine
    container_name: zro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zro}
      PGDATA: /var/lib/postgresql/docker/18
    volumes:
      - pgdata:/var/lib/postgresql/docker/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zro}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - zro-mesh

  # ZRO Control Plane (API Server, IPAM, Smart Delegation)
  zro-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zro-plane
    restart: unless-stopped
    command: ["plane"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZRO_MODE: plane
      ZRO_LOG_LEVEL: info
      ZRO_CONTROL_PLANE_LISTEN_ADDR: ":8443"
      ZRO_CONTROL_PLANE_PUBLIC_URL: "http://zro-plane:8443"
      ZRO_CONTROL_PLANE_DATABASE_DRIVER: postgres
      ZRO_CONTROL_PLANE_DATABASE_DSN: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-zro}?sslmode=disable"
      ZRO_CONTROL_PLANE_SECRET_KEY: "${CLUSTER_SECRET:?set CLUSTER_SECRET (openssl rand -hex 32)}"
      ZRO_CONTROL_PLANE_DEFAULT_CIDR_V4: "100.64.0.0/10"
      ZRO_CONTROL_PLANE_DEFAULT_CIDR_V6: "fd00:cafe::/64"
      ZRO_CONTROL_PLANE_REQUIRE_AUTH: "${CONTROL_PLANE_REQUIRE_AUTH:-true}"
      ZRO_CONTROL_PLANE_EDGE_API_KEY: "${EDGE_API_KEY:?set EDGE_API_KEY (openssl rand -hex 32)}"
      ZRO_CONTROL_PLANE_ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      ZRO_CONTROL_PLANE_NODE_TTL: "${NODE_TTL:-168h}"
      # gRPC is opt in and needs TLS (or GRPC_INSECURE=true behind a TLS proxy); see docs/deployment.md.
      ZRO_CONTROL_PLANE_GRPC_LISTEN_ADDR: "${GRPC_LISTEN_ADDR:-}"
      ZRO_CONTROL_PLANE_GRPC_TLS_CERT: "${GRPC_TLS_CERT:-}"
      ZRO_CONTROL_PLANE_GRPC_TLS_KEY: "${GRPC_TLS_KEY:-}"
      ZRO_CONTROL_PLANE_GRPC_INSECURE: "${GRPC_INSECURE:-false}"
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zro-mesh

  # Edge PoP 1: Cambodia (KH)
  zro-edge-kh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zro-edge-kh
    restart: unless-stopped
    command: ["edge"]
    depends_on:
      zro-plane:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      ZRO_MODE: edge
      ZRO_EDGE_POP_CODE: "KH"
      ZRO_EDGE_REGION: "Asia/Phnom_Penh"
      ZRO_EDGE_PUBLIC_ENDPOINT: "${ZRO_EDGE_KH_ENDPOINT:-auto}"
      ZRO_EDGE_LISTEN_PORT: 51820
      ZRO_EDGE_INTERFACE_NAME: "zro-edge"
      ZRO_EDGE_MTU: 1420
      ZRO_EDGE_PLANE_ENDPOINT: "http://zro-plane:8443"
      # Shared key for the first registration only; the PoP is then issued its own credential,
      # kept (with its WireGuard key) in the state volume.
      ZRO_EDGE_EDGE_API_KEY: "${EDGE_API_KEY:?set EDGE_API_KEY}"
      ZRO_EDGE_STATE_DIR: /var/lib/zro
    volumes:
      - edge-kh-state:/var/lib/zro
    ports:
      - "51820:51820/udp"
    networks:
      - zro-mesh

  # Edge PoP 2: Singapore (SG)
  zro-edge-sg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zro-edge-sg
    restart: unless-stopped
    command: ["edge"]
    depends_on:
      zro-plane:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      ZRO_MODE: edge
      ZRO_EDGE_POP_CODE: "SG"
      ZRO_EDGE_REGION: "Asia/Singapore"
      ZRO_EDGE_PUBLIC_ENDPOINT: "${ZRO_EDGE_SG_ENDPOINT:-auto}"
      ZRO_EDGE_LISTEN_PORT: 51821
      ZRO_EDGE_INTERFACE_NAME: "zro-edge"
      ZRO_EDGE_MTU: 1420
      ZRO_EDGE_PLANE_ENDPOINT: "http://zro-plane:8443"
      # Shared key for the first registration only; the PoP is then issued its own credential,
      # kept (with its WireGuard key) in the state volume.
      ZRO_EDGE_EDGE_API_KEY: "${EDGE_API_KEY:?set EDGE_API_KEY}"
      ZRO_EDGE_STATE_DIR: /var/lib/zro
    volumes:
      - edge-sg-state:/var/lib/zro
    ports:
      - "51821:51821/udp"
    networks:
      - zro-mesh

  # Ingress Gateway & Load Balancer 1 (gw1)
  zro-gw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zro-gw
    restart: unless-stopped
    command: ["gw"]
    depends_on:
      zro-plane:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      ZRO_MODE: gw
      ZRO_GATEWAY_HOSTNAME: "gw1"
      ZRO_GATEWAY_PLANE_ENDPOINT: "http://zro-plane:8443"
      ZRO_GATEWAY_INTERFACE_NAME: "zro-gw"
      ZRO_GATEWAY_LISTEN_PORT: 0
      ZRO_GATEWAY_LISTEN_HTTP: ":80"
      ZRO_GATEWAY_DOMAIN: "app.cubis.internal"
      # Mint once the plane is up (see docs/deployment.md); without it the gateway serves static routes only.
      ZRO_GATEWAY_ENROLLMENT_TOKEN: "${GATEWAY1_ENROLLMENT_TOKEN:-}"
      ZRO_GATEWAY_STATE_DIR: /var/lib/zro
    volumes:
      - gw1-state:/var/lib/zro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    networks:
      - zro-mesh

  # Ingress Gateway & Load Balancer 2 (gw2 for HA clustering / failover)
  zro-gw2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zro-gw2
    restart: unless-stopped
    command: ["gw"]
    depends_on:
      zro-plane:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      ZRO_MODE: gw
      ZRO_GATEWAY_HOSTNAME: "gw2"
      ZRO_GATEWAY_PLANE_ENDPOINT: "http://zro-plane:8443"
      ZRO_GATEWAY_INTERFACE_NAME: "zro-gw"
      ZRO_GATEWAY_LISTEN_PORT: 0
      ZRO_GATEWAY_LISTEN_HTTP: ":80"
      ZRO_GATEWAY_DOMAIN: "app.cubis.internal"
      ZRO_GATEWAY_ENROLLMENT_TOKEN: "${GATEWAY2_ENROLLMENT_TOKEN:-}"
      ZRO_GATEWAY_STATE_DIR: /var/lib/zro
    volumes:
      - gw2-state:/var/lib/zro
    ports:
      - "${GATEWAY_PORT_2:-8081}:80"
    networks:
      - zro-mesh

networks:
  zro-mesh:
    name: zro-mesh-network
    driver: bridge

volumes:
  pgdata:
    name: zro-postgres-data
  edge-kh-state:
  edge-sg-state:
  gw1-state:
  gw2-state:
