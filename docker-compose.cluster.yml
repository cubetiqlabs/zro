# Production Cluster Deployment (Cloud / Multi-Server Topology)
# Each profile usually runs on a different host, so required values are not enforced by compose
# here; the plane refuses to start with require_auth and a weak or empty CLUSTER_SECRET, and edges
# and gateways log a clear error if the plane rejects them. See .env.example for what each needs.
# Usage:
#   docker compose -f docker-compose.cluster.yml --profile plane up -d
#   docker compose -f docker-compose.cluster.yml --profile edge up -d
#   docker compose -f docker-compose.cluster.yml --profile gateway up -d

services:
  # Standalone / Clustered Control Plane (Behind Cloud Load Balancer)
  plane:
    profiles: ["plane"]
    image: ghcr.io/sombochea/zro:${ZRO_VERSION:-latest}
    restart: always
    command: ["plane"]
    environment:
      ZRO_MODE: plane
      ZRO_LOG_LEVEL: ${LOG_LEVEL:-info}
      ZRO_CONTROL_PLANE_LISTEN_ADDR: ":8443"
      ZRO_CONTROL_PLANE_REQUIRE_AUTH: "${CONTROL_PLANE_REQUIRE_AUTH:-true}"
      ZRO_CONTROL_PLANE_EDGE_API_KEY: "${EDGE_API_KEY:-}"
      ZRO_CONTROL_PLANE_ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      ZRO_CONTROL_PLANE_NODE_TTL: "${NODE_TTL:-168h}"
      # gRPC is opt in and needs TLS (mount the certificate and point these at it).
      ZRO_CONTROL_PLANE_GRPC_LISTEN_ADDR: "${GRPC_LISTEN_ADDR:-}"
      ZRO_CONTROL_PLANE_GRPC_TLS_CERT: "${GRPC_TLS_CERT:-}"
      ZRO_CONTROL_PLANE_GRPC_TLS_KEY: "${GRPC_TLS_KEY:-}"
      ZRO_CONTROL_PLANE_GRPC_INSECURE: "${GRPC_INSECURE:-false}"
      ZRO_CONTROL_PLANE_PUBLIC_URL: "${PUBLIC_URL:-https://zro-plane.cubis.tech:443}"
      ZRO_CONTROL_PLANE_DATABASE_DRIVER: postgres
      ZRO_CONTROL_PLANE_DATABASE_DSN: "${DATABASE_DSN}" # External Cloud DB (RDS / Cloud SQL)
      ZRO_CONTROL_PLANE_SECRET_KEY: "${CLUSTER_SECRET:-}"
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Standalone Edge PoP (Runs directly on VPS / Bare-Metal with Public IP)
  # Uses host networking to eliminate Docker bridge NAT overhead and achieve line-rate WireGuard throughput.
  edge:
    profiles: ["edge"]
    image: ghcr.io/sombochea/zro:${ZRO_VERSION:-latest}
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    command: ["edge"]
    environment:
      ZRO_MODE: edge
      ZRO_EDGE_POP_CODE: "${POP_CODE}" # e.g. KH, SG, US, HK, DE
      ZRO_EDGE_REGION: "${REGION}"
      ZRO_EDGE_PUBLIC_ENDPOINT: "${PUBLIC_ENDPOINT}" # e.g. 173.1.1.1:51820
      ZRO_EDGE_LISTEN_PORT: ${LISTEN_PORT:-51820}
      ZRO_EDGE_INTERFACE_NAME: "${INTERFACE_NAME:-zro-edge}"
      ZRO_EDGE_MTU: ${EDGE_MTU:-1420}
      ZRO_EDGE_WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY:-}"
      ZRO_EDGE_PLANE_ENDPOINT: "${PLANE_ENDPOINT:-https://zro-plane.cubis.tech:443}"
      ZRO_EDGE_PLANE_TRANSPORT: "${PLANE_TRANSPORT:-rest}"
      ZRO_EDGE_EDGE_API_KEY: "${EDGE_API_KEY:-}"
      ZRO_EDGE_STATE_DIR: /var/lib/zro
      ZRO_EDGE_IS_ANYCAST: "${IS_ANYCAST:-false}"
    volumes:
      - edge-state:/var/lib/zro

  # Standalone Ingress Gateway (L4/L7 Reverse Proxy & Load Balancer)
  gateway:
    profiles: ["gateway"]
    image: ghcr.io/sombochea/zro:${ZRO_VERSION:-latest}
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    command: ["gw"]
    environment:
      ZRO_MODE: gw
      ZRO_GATEWAY_PLANE_ENDPOINT: "${PLANE_ENDPOINT:-https://zro-plane.cubis.tech:443}"
      ZRO_GATEWAY_PLANE_TRANSPORT: "${PLANE_TRANSPORT:-rest}"
      ZRO_GATEWAY_ENROLLMENT_TOKEN: "${GATEWAY_ENROLLMENT_TOKEN:-}"
      ZRO_GATEWAY_STATE_DIR: /var/lib/zro
      ZRO_GATEWAY_NETWORK_ID: "${NETWORK_ID}"
      ZRO_GATEWAY_INTERFACE_NAME: "${GATEWAY_INTERFACE_NAME:-zro-gw}"
      ZRO_GATEWAY_LISTEN_PORT: ${GATEWAY_LISTEN_PORT:-0}
      ZRO_GATEWAY_LISTEN_HTTP: ":80"
      ZRO_GATEWAY_LISTEN_HTTPS: ":443"
      ZRO_GATEWAY_AUTO_TLS: "${AUTO_TLS:-true}"
      ZRO_GATEWAY_DOMAIN: "${GATEWAY_DOMAIN}"
      ZRO_GATEWAY_CERT_DIR: "/var/lib/zro/certs"
    volumes:
      - gateway-state:/var/lib/zro
      - certs:/var/lib/zro/certs

volumes:
  certs:
    name: zro-cluster-certs
  edge-state:
  gateway-state:
